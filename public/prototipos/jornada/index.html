<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ateliê IA — Jornada de Capacitação</title>
<style>
:root{
  --bg:#0d1117; --bg-2:#131a23; --panel:#161d27; --panel-2:#1b2431;
  --line:#243041; --line-soft:#1d2836;
  --txt:#e8edf4; --txt-2:#9fb0c3; --txt-3:#6f8098;
  --accent:#5b8cff; --accent-2:#7cf0c0; --warn:#ffb648; --bad:#ff6b6b;
  --gold:#f2c94c;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="light"]{
  --bg:#f4f6fa; --bg-2:#eceff5; --panel:#ffffff; --panel-2:#f7f9fc;
  --line:#dfe5ee; --line-soft:#e9edf4;
  --txt:#14202e; --txt-2:#51627a; --txt-3:#7e8ea5;
  --shadow:0 8px 24px rgba(20,32,46,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:650;letter-spacing:-.01em}
p{margin:0 0 .8em}
ul{margin:.2em 0 .8em;padding-left:1.15em}
li{margin:.25em 0}
code{background:var(--panel-2);border:1px solid var(--line-soft);padding:.05em .35em;border-radius:6px;font-size:.88em}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{
  background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:16px 12px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 18px}
.brand .mark{
  width:32px;height:32px;border-radius:9px;flex:none;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#07101c;font-weight:800;font-size:15px;
}
.brand b{font-size:14.5px;display:block;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--txt-3);display:block;letter-spacing:.04em;text-transform:uppercase}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;padding:9px 10px;border-radius:9px;color:var(--txt-2);cursor:pointer;font-size:14px;
}
.navbtn:hover{background:var(--panel);color:var(--txt)}
.navbtn[aria-current="true"]{background:var(--panel);color:var(--txt);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.navbtn .ic{width:18px;text-align:center;opacity:.9}
.navbtn .tag{margin-left:auto;font-size:11px;color:var(--txt-3)}
.rail .spacer{flex:1}
.railcard{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;
}
.railcard .lvl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--txt-2)}
.railcard .lvl b{font-size:13px;color:var(--txt)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.mini{font-size:11.5px;color:var(--txt-3)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 88%,transparent);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)
}
.crumb{font-size:12.5px;color:var(--txt-3)}
.topbar h2{font-size:16px}
.topbar .grow{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--txt-2)
}
.chip b{color:var(--txt)}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:9px;width:34px;height:32px;cursor:pointer;color:var(--txt-2)}
.iconbtn:hover{color:var(--txt)}
.view{padding:26px;max-width:1080px;width:100%}

/* ---------- generic ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.muted{color:var(--txt-2)}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt-3);font-weight:600}
.btn{
  background:var(--accent);color:#08111f;border:0;border-radius:10px;padding:9px 16px;font-weight:650;
  cursor:pointer;font-size:14px;transition:transform .08s ease,filter .15s ease
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
.btn.soft{background:var(--panel-2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.sep{height:1px;background:var(--line-soft);margin:16px 0}
.pill{font-size:11px;border-radius:99px;padding:3px 9px;font-weight:600;border:1px solid transparent}
.pill.locked{background:var(--panel-2);color:var(--txt-3);border-color:var(--line)}
.pill.open{background:rgba(91,140,255,.14);color:var(--accent);border-color:rgba(91,140,255,.35)}
.pill.done{background:rgba(124,240,192,.13);color:var(--accent-2);border-color:rgba(124,240,192,.3)}

/* ---------- journey ---------- */
.hero{
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--panel)),var(--panel));
  border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:22px;display:flex;gap:24px;align-items:center;flex-wrap:wrap
}
.hero h1{font-size:23px;margin-bottom:6px}
.hero p{color:var(--txt-2);max-width:56ch;margin:0}
.hero .stats{display:flex;gap:22px;margin-left:auto}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:11.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.06em}

.path{position:relative;padding-left:34px}
.path:before{content:"";position:absolute;left:12px;top:10px;bottom:24px;width:2px;background:var(--line)}
.mod{position:relative;margin-bottom:14px}
.mod .dot{
  position:absolute;left:-34px;top:20px;width:26px;height:26px;border-radius:50%;
  background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--txt-3);font-weight:700
}
.mod.open .dot{border-color:var(--accent);color:var(--accent)}
.mod.done .dot{border-color:var(--accent-2);color:#07101c;background:var(--accent-2)}
.modcard{
  width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;cursor:pointer;display:flex;gap:16px;align-items:center;transition:border-color .15s ease,transform .1s ease
}
.modcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.mod.locked .modcard{cursor:not-allowed;opacity:.62}
.mod.locked .modcard:hover{transform:none;border-color:var(--line)}
.modcard h3{font-size:15.5px;display:flex;align-items:center;gap:9px}
.modcard p{margin:5px 0 0;font-size:13.2px;color:var(--txt-2);max-width:62ch}
.modcard .meta{margin-left:auto;text-align:right;flex:none}
.modcard .meta .mini{white-space:nowrap}
.modprog{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px;max-width:320px}
.modprog>i{display:block;height:100%;background:var(--accent-2)}

/* ---------- module detail ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 20px}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--txt-2);cursor:pointer;font-size:14px
}
.tab[aria-selected="true"]{color:var(--txt);border-bottom-color:var(--accent);font-weight:600}
.tab .badge{font-size:10.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:1px 6px;margin-left:6px;color:var(--txt-3)}
.lesson{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--panel)}
.lesson>summary{
  cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;list-style:none;font-weight:600;font-size:14.4px
}
.lesson>summary::-webkit-details-marker{display:none}
.lesson>summary .tick{
  width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;color:transparent;flex:none
}
.lesson.done>summary .tick{background:var(--accent-2);border-color:var(--accent-2);color:#07101c}
.lesson .body{padding:2px 16px 16px;border-top:1px solid var(--line-soft);color:var(--txt-2);font-size:14.2px}
.lesson .body h4{color:var(--txt);font-size:13.5px;margin:14px 0 6px}
.keyline{border-left:2px solid var(--accent);background:var(--panel-2);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;color:var(--txt)}

/* ---------- lab ---------- */
.lab{display:grid;grid-template-columns:1fr 340px;gap:16px}
@media (max-width:900px){.lab{grid-template-columns:1fr}}
textarea,input[type=text],input[type=number],select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical
}
textarea:focus,input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13.3px;padding:7px 0;border-bottom:1px dashed var(--line-soft);color:var(--txt-2)}
.check:last-child{border-bottom:0}
.check .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:transparent;margin-top:1px}
.check.ok .box{background:var(--accent-2);border-color:var(--accent-2);color:#07101c}
.check.ok{color:var(--txt)}
.score{font-size:30px;font-weight:700;letter-spacing:-.02em}
.out{
  background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13.6px;
  white-space:pre-wrap;color:var(--txt-2);min-height:80px
}
.opt{
  display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  margin-bottom:8px;cursor:pointer;background:var(--panel);font-size:14px
}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt.correct{border-color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 8%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.claim{
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;background:var(--panel);font-size:14px
}
.claim[data-sel="true"]{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--panel))}
.claim.correct{border-color:var(--accent-2)}
.claim.miss{border-color:var(--bad)}
.claim small{display:block;color:var(--txt-3);margin-top:5px;font-size:12.2px}
.step{
  display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;background:var(--panel);font-size:14px
}
.step .ord{width:24px;height:24px;border-radius:7px;background:var(--panel-2);display:grid;place-items:center;font-size:12px;color:var(--txt-3);flex:none}
.step .mv{margin-left:auto;display:flex;gap:4px}
.kv{display:flex;justify-content:space-between;font-size:13.4px;padding:6px 0;border-bottom:1px dashed var(--line-soft)}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}

/* ---------- badges ---------- */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.badge-card{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;background:var(--panel);opacity:.45;filter:grayscale(1)}
.badge-card.earned{opacity:1;filter:none;border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
.badge-card .em{font-size:26px}
.badge-card b{display:block;margin-top:6px;font-size:13.5px}
.badge-card span{font-size:12px;color:var(--txt-3)}

.toast{
  position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent-2);
  border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);z-index:50;max-width:320px;transform:translateY(12px);opacity:0;
  transition:all .3s cubic-bezier(.2,.8,.2,1);pointer-events:none
}
.toast.show{transform:none;opacity:1}
.toast b{display:block;font-size:13.5px}
.toast span{font-size:12.5px;color:var(--txt-2)}

.cert{
  border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:16px;padding:30px;text-align:center;
  background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 9%,var(--panel)),var(--panel))
}
.cert h2{font-size:22px;margin-bottom:6px}
.captags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.captag{font-size:10.5px;color:var(--txt-3);border:1px solid var(--line);border-radius:99px;padding:2px 8px;background:var(--panel-2);white-space:nowrap}
.caprow{display:flex;align-items:center;font-size:13.2px;padding:5px 0}
.caprow>span:first-child{min-width:150px;color:var(--txt-2)}
.caprow .bar{margin:0}
.libitem .out{max-height:180px;overflow:auto}
@media (max-width:980px){
  .grid[style*="320px"],.grid[style*="300px"]{grid-template-columns:1fr !important}
}
@media (max-width:760px){
  .caprow>span:first-child{min-width:110px}
  .tabs{overflow-x:auto}
  .topbar{flex-wrap:wrap;gap:8px;padding:12px 16px}
  .topbar>div:first-child{min-width:0;flex:1 1 100%}
  .topbar h2{font-size:15px;overflow-wrap:anywhere}
  .topbar .grow{display:none}
  .chip{padding:4px 9px;font-size:11.5px}
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}
  .rail .spacer,.railcard{display:none}
  .brand{padding:0 10px 0 0}
  .view{padding:18px}
  .hero .stats{margin-left:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark">AI</div>
      <div><b>Ateliê IA</b><span>Formação</span></div>
    </div>
    <button class="navbtn" data-nav="home"><span class="ic">◉</span> Hoje <span class="tag" id="navHome"></span></button>
    <button class="navbtn" data-nav="journey"><span class="ic">◎</span> Trilhas <span class="tag" id="navTrilhas"></span></button>
    <button class="navbtn" data-nav="labs"><span class="ic">⚗</span> Laboratórios <span class="tag" id="navLabs"></span></button>
    <button class="navbtn" data-nav="library"><span class="ic">▤</span> Biblioteca <span class="tag" id="navLib"></span></button>
    <button class="navbtn" data-nav="growth"><span class="ic">◠</span> Evolução</button>
    <button class="navbtn" data-nav="portfolio"><span class="ic">◧</span> Portfólio <span class="tag" id="navCases"></span></button>
    <button class="navbtn" data-nav="profile"><span class="ic">☺</span> Perfil</button>
    <div class="spacer"></div>
    <div class="railcard">
      <div class="lvl"><b id="railLevel">Nível 1</b><span id="railXp">0 XP</span></div>
      <div class="bar"><i id="railBar" style="width:0%"></i></div>
      <div class="mini" id="railNext">Faltam 100 XP para o próximo nível</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <div class="crumb" id="crumb">Jornada</div>
        <h2 id="title">Trilha de capacitação em IA</h2>
      </div>
      <div class="grow"></div>
      <span class="chip">⚡ <b id="chipXp">0</b> XP</span>
      <span class="chip">◷ <b id="chipStreak">0</b> dias seguidos</span>
      <button class="iconbtn" id="themeBtn" title="Alternar tema">◐</button>
      <button class="iconbtn" id="resetBtn" title="Reiniciar progresso">↺</button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="toast" id="toast"><b id="toastT"></b><span id="toastS"></span></div>

<script>
/* =======================================================================
   Protótipo — Ateliê IA: jornada de formação com liberação progressiva
   Estado 100% local (localStorage). Nenhuma chamada de rede.
   ======================================================================= */

const XP = { lesson: 10, lab: 40, quiz: 30 };
const LEVELS = [0, 100, 250, 450, 700, 1000];

const MODULES = [
  {
    id: "m1",
    title: "Fundamentos: o que a IA realmente faz",
    blurb: "Como um modelo de linguagem gera texto, o que ele sabe e onde ele erra por construção.",
    duration: "25 min",
    skills: ["Vocabulário", "Limites do modelo"],
    caps: { fund: 70, critica: 20 },
    lessons: [
      {
        id: "l1", title: "Previsão de próxima palavra, não busca",
        body: `<p>Um LLM não consulta um banco de respostas. Ele estima, a cada passo, qual é o próximo pedaço de texto mais provável dado tudo que veio antes. Isso explica as duas faces da ferramenta: fluência altíssima e confiança indiferente à verdade.</p>
        <div class="keyline">Regra prática: o modelo otimiza <b>plausibilidade</b>, não <b>correção</b>. Quem garante correção é o processo ao redor dele — você.</div>
        <h4>O que decorre disso</h4>
        <ul><li>Texto bem escrito não é sinal de texto certo.</li><li>O modelo raramente diz "não sei" sem ser instruído a isso.</li><li>Mudar o enunciado muda a resposta: o prompt é parte do sistema.</li></ul>`
      },
      {
        id: "l2", title: "Janela de contexto e memória",
        body: `<p>Tudo que o modelo "sabe" naquele instante cabe na janela de contexto: instrução, histórico da conversa e arquivos anexados. Fora dali existe só o que foi absorvido no treino — datado e impreciso para fatos específicos.</p>
        <h4>Consequências no dia a dia</h4>
        <ul><li>Conversa muito longa começa a perder o começo: reinicie com um resumo.</li><li>Dado da sua empresa só entra se você colar ou conectar.</li><li>Contexto irrelevante atrapalha tanto quanto contexto faltando.</li></ul>`
      },
      {
        id: "l3", title: "Onde ganhar tempo já na primeira semana",
        body: `<p>Comece por tarefas com <b>verificação barata</b>: você olha e sabe na hora se está bom.</p>
        <ul><li>Rascunhar e reescrever textos que você revisaria de qualquer jeito.</li><li>Resumir material longo que você já conhece parcialmente.</li><li>Traduzir formatos: ata → tarefas, planilha → texto, texto → tabela.</li><li>Explicar código, erro ou documento denso.</li></ul>
        <div class="keyline">Evite no começo: decisões sem revisor, números que ninguém confere e qualquer coisa que vá direto para o cliente.</div>`
      }
    ],
    lab: { type: "prompt" },
    quiz: [
      { q: "Por que um LLM inventa referências com tanta segurança?", o: ["Porque busca na internet e acha páginas erradas", "Porque gera o texto mais provável, e uma citação plausível é provável", "Porque a janela de contexto está cheia"], a: 1,
        why: "Ele completa padrões. Uma citação com cara de citação é estatisticamente provável, exista ela ou não." },
      { q: "Você precisa de uma política interna da sua empresa numa resposta. O que é necessário?", o: ["Pedir com mais detalhes ao modelo", "Colocar o documento no contexto (colar, anexar ou conectar)", "Usar um modelo maior"], a: 1,
        why: "Nenhum tamanho de modelo adivinha dados que nunca viu. O dado precisa entrar na janela de contexto." },
      { q: "Qual tarefa é a melhor para começar?", o: ["Aprovar um orçamento automaticamente", "Resumir uma ata de reunião que você participou", "Responder clientes sem revisão"], a: 1,
        why: "Verificação barata: você estava lá, confere em segundos e o erro é reversível." }
    ]
  },
  {
    id: "m2",
    title: "Anatomia de um bom prompt",
    blurb: "Papel, objetivo, contexto, formato e restrições — e um lab que pontua o seu prompt em tempo real.",
    duration: "30 min",
    skills: ["Prompting", "Especificação"],
    caps: { prompt: 80, fund: 15 },
    lessons: [
      {
        id: "l1", title: "Os cinco blocos",
        body: `<p>Prompt bom é especificação curta, não pedido educado.</p>
        <ul>
          <li><b>Papel</b> — de que ponto de vista responder ("como analista de dados sênior").</li>
          <li><b>Objetivo</b> — o resultado esperado, com verbo claro.</li>
          <li><b>Contexto</b> — os dados, o público, a situação.</li>

/* ---------------- estado ---------------- */
const KEY = "atelie-ia-proto-v2";
const blank = () => ({
  xp: 0, lessons: {}, labs: {}, quizzes: {}, badges: [], capstone: "",
  caps: {},            /* pontos por capability */
  credited: {},        /* fração já creditada por módulo (teto de 100%) */
  diagCaps: {},        /* pontos vindos do diagnóstico, para refazer sem somar duas vezes */
  waived: {},          /* módulos aprovados por prova de dispensa */
  review: [],          /* fila de revisão espaçada */
  prompts: [],         /* prompts salvos pelo usuário */
  cases: [],           /* portfólio de aplicação */
  days: [],            /* dias com atividade (streak) */
  acts: [],            /* atividades recentes: {d:"YYYY-MM-DD"} */
  diag: null,          /* resultado do diagnóstico de entrada */
  offset: 0            /* dias simulados, para demonstrar revisão espaçada */
});
let S = load();
function load(){ try{ return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); }catch(e){ return blank(); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* relógio do protótipo: permite simular a passagem de dias na revisão espaçada */
const DAY = 864e5;
const now = () => Date.now() + (S.offset||0)*DAY;
const today = () => new Date(now()).toISOString().slice(0,10);

const lessonDone = (m,l) => !!S.lessons[m+"."+l];
const labScore   = m => S.labs[m] ?? null;
const quizScore  = m => S.quizzes[m] ?? null;
const labDone    = m => labScore(m) !== null;
const quizPassed = m => (quizScore(m) ?? -1) >= 2;
const waived     = m => !!S.waived[m];
function moduleDone(m){
  if(waived(m)) return true;
  const mod = byId(m);
  return mod.lessons.every(l=>lessonDone(m,l.id)) && labDone(m) && quizPassed(m);
}
function moduleProgress(m){
  const mod = byId(m);
  if(waived(m)) return { done: mod.lessons.length+2, total: mod.lessons.length+2, pct: 100 };
  const total = mod.lessons.length + 2;
  const done = mod.lessons.filter(l=>lessonDone(m,l.id)).length + (labDone(m)?1:0) + (quizPassed(m)?1:0);
  return { done, total, pct: Math.round(done/total*100) };
}

/* ---- desbloqueio: sequência na trilha base, capability nos eletivos ---- */
function requirement(mod){
  if(mod.requires && mod.requires.caps){
    return Object.entries(mod.requires.caps)
      .map(([c,v]) => capName(c) + " " + v + " pts")
      .join(" + ");
  }
  const i = MODULES.indexOf(mod);
  return i > 0 ? "concluir " + MODULES[i-1].title : "";
}
function unlockedM(mod){
  if(mod.requires){
    const r = mod.requires;
    if(r.modules && !r.modules.every(moduleDone)) return false;
    if(r.caps && !Object.entries(r.caps).every(([c,v]) => capPoints(c) >= v)) return false;
    return true;
  }
  const i = MODULES.indexOf(mod);
  return i === 0 || moduleDone(MODULES[i-1].id);
}
const unlocked = i => unlockedM(MODULES[i]);

/* ---- capabilities ---- */
const capName   = id => (CAPS.find(c=>c.id===id)||{}).nome || id;
const capPoints = id => Math.round(S.caps[id] || 0);
function capMax(id){ return ALL.reduce((s,m)=> s + (m.caps[id]||0), 0) + 45; }
function capLevel(id){
  const p = capPoints(id);
  let lv = CAP_LEVELS[0];
  CAP_LEVELS.forEach(l => { if(p >= l.min) lv = l; });
  return lv;
}
function capNext(id){
  const p = capPoints(id);
  return CAP_LEVELS.find(l => l.min > p) || null;
}
function creditCaps(mid, kind, factor){
  const mod = byId(mid); if(!mod || !mod.caps) return;
  const used = S.credited[mid] || 0;
  const share = Math.min(CAP_SPLIT[kind] * (factor ?? 1), 1 - used);
  if(share <= 0) return;
  S.credited[mid] = used + share;
  Object.entries(mod.caps).forEach(([c,v]) => { S.caps[c] = (S.caps[c]||0) + v*share; });
  save();
}

/* ---- atividade, streak e metas ---- */
function logActivity(){
  const d = today();
  if(!S.days.includes(d)) S.days.push(d);
  S.acts.push({ d });
  if(S.acts.length > 400) S.acts = S.acts.slice(-400);
  save();
}
function streak(){
  if(!S.days.length) return 0;
  const set = new Set(S.days);
  let n = 0, cur = new Date(now());
  for(;;){
    const k = cur.toISOString().slice(0,10);
    if(set.has(k)) n++; else if(n > 0 || k !== today()) break;
    cur = new Date(cur.getTime() - DAY);
    if(n > 400) break;
  }
  return n;
}
function weekActs(){
  const limit = now() - 7*DAY;
  return S.acts.filter(a => new Date(a.d + "T12:00:00Z").getTime() >= limit).length;
}
const WEEK_GOAL = 5;

/* ---- revisão espaçada ---- */
const SPACING = [1, 3, 7];
function scheduleReview(mid, qi){
  const k = mid + "." + qi;
  if(S.review.some(r=>r.k===k)) return;
  S.review.push({ k, mid, qi, due: now(), streak: 0 });
  save();
}
const dueReviews = () => S.review.filter(r => r.due <= now());
function answerReview(r, correct){
  const idx = S.review.findIndex(x=>x.k===r.k);
  if(idx < 0) return;
  if(correct){
    const st = S.review[idx].streak + 1;
    if(st >= 2){ S.review.splice(idx,1); }
    else { S.review[idx].streak = st; S.review[idx].due = now() + SPACING[st-1]*DAY; }
  } else {
    S.review[idx].streak = 0;
    S.review[idx].due = now() + SPACING[0]*DAY;
  }
  save();
}

function levelOf(xp){ let lv=1; LEVELS.forEach((t,i)=>{ if(xp>=t) lv=i+1; }); return Math.min(lv, LEVELS.length); }

function addXp(n, label){
  S.xp += n; logActivity(); save(); renderChrome();
  toast("+" + n + " XP", label);
}
function grant(id){
  if(S.badges.includes(id)) return;
  S.badges.push(id); save();
  const b = BADGES.find(x=>x.id===id);
  setTimeout(()=>toast(b.em + "  Conquista desbloqueada", b.t), 700);
  renderChrome();
}
let toastTimer;
function toast(t, s){
  const el = document.getElementById("toast");
  document.getElementById("toastT").textContent = t;
  document.getElementById("toastS").textContent = s || "";
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 3200);
}

  document.getElementById("navLabs").textContent = labs + "/" + ALL.length;

function render(){
  const v = document.getElementById("view");
  if(!S.diag && route.name !== "diag") route = { name:"diag", mod:null, tab:"lessons" };

  else if(route.name === "module"){ v.innerHTML = viewModule(); wireModule(); }
  else if(route.name === "labs") v.innerHTML = viewLabs();

  else if(route.name === "portfolio"){ v.innerHTML = viewPortfolio(); wirePortfolio(); }
  else { v.innerHTML = viewProfile(); wireProfile(); }

  });
}

/* ---------------- trilhas ---------------- */
function modCard(m, i, opts){
  const open = unlockedM(m), done = moduleDone(m.id), p = moduleProgress(m.id);
  const state = done ? "done" : open ? "open" : "locked";
  const pill = done ? '<span class="pill done">'+(waived(m.id)?"dispensado":"concluído")+'</span>'
    : open ? '<span class="pill open">disponível</span>'
    : '<span class="pill locked">bloqueado</span>';
  const req = !open ? '<div class="mini" style="margin-top:8px">Requisito: <b>'+requirement(m)+'</b></div>' : "";
  const capTags = Object.entries(m.caps).map(([c,v]) => '<span class="captag">'+capName(c)+' +'+v+'</span>').join("");
  return `<div class="mod ${state}">
    <div class="dot">${done ? "✓" : (opts && opts.mark) || i+1}</div>
    <button class="modcard" ${open ? 'data-goto="module:'+m.id+':lessons"' : "disabled"}>
      <div style="min-width:0">
        <h3>${m.title} ${pill}</h3>
        <p>${m.blurb}</p>
        ${open ? '<div class="modprog"><i style="width:'+p.pct+'%"></i></div><div class="mini" style="margin-top:6px">'+p.done+' de '+p.total+' etapas · '+m.duration+'</div>' : req}
        <div class="captags">${capTags}</div>
      </div>
      <div class="meta">
        <div class="mini" style="color:var(--txt-2)">${open ? (done ? "revisar →" : "continuar →") : ""}</div>
      </div>
    </button>
  </div>`;
}

/* ---------------- diagnóstico de entrada ---------------- */
function viewDiag(){
  document.getElementById("crumb").textContent = "Diagnóstico";
  document.getElementById("title").textContent = "Onde você está hoje";
  const qs = DIAG.map((d,i)=>`<div class="card" style="margin-bottom:12px">
      <div class="eyebrow">${capName(d.cap)}</div>
      <h3 style="font-size:15px;margin:6px 0 12px">${d.q}</h3>
      ${d.o.map((o,oi)=>`<label class="opt"><input type="radio" name="d${i}" value="${oi}"><span>${o}</span></label>`).join("")}
    </div>`).join("");
  return `<section class="hero">
      <div>
        <div class="eyebrow">Passo 1 de 1 · 2 minutos</div>
        <h1>Antes de começar: o que você já sabe</h1>
        <p>Seis perguntas definem seu ponto de partida em cada competência e a ordem recomendada. Nada aqui bloqueia conteúdo — só evita que você percorra o que já domina.</p>
      </div>
    </section>
    <div class="card" style="margin-bottom:14px">
      <div class="eyebrow">Seu papel</div>
      <div class="row" style="margin-top:10px">${ROLES.map(r=>`<label class="opt" style="margin:0"><input type="radio" name="role" value="${r.id}"><span>${r.t}</span></label>`).join("")}</div>
    </div>
    ${qs}
    <div class="row"><button class="btn" id="diagGo">Ver meu ponto de partida</button>
      <button class="btn soft sm" id="diagSkip">Pular diagnóstico</button></div>`;
}
function wireDiag(){
  document.getElementById("diagSkip").onclick = () => { S.diag = { role:null, skipped:true }; save(); go("home"); };
  document.getElementById("diagGo").onclick = () => {
    const role = (document.querySelector('input[name="role"]:checked')||{}).value || null;
    let answered = 0;
    const pts = {};
    DIAG.forEach((d,i)=>{
      const sel = document.querySelector('input[name="d'+i+'"]:checked');
      if(!sel) return;
      answered++;
      pts[d.cap] = (pts[d.cap]||0) + DIAG_PTS[+sel.value];
    });
    if(!answered){ toast("Responda ao menos uma pergunta", "ou pule o diagnóstico"); return; }
    Object.entries(S.diagCaps || {}).forEach(([c,v]) => { S.caps[c] = Math.max(0, (S.caps[c]||0) - v); });
    Object.entries(pts).forEach(([c,v]) => { S.caps[c] = (S.caps[c]||0) + v; });
    S.diagCaps = pts;
    S.diag = { role, at: today() }; save();
    toast("Ponto de partida definido", "Seu radar já começa preenchido");
    go("home");
  };
}

/* ---------------- Hoje ---------------- */
function nextAction(){
  const due = dueReviews().length;
  if(due) return { t:"Revisar "+due+" item"+(due>1?"s":""), d:"Questões que você errou voltaram para fixar.", go:"home", btn:"Revisar agora", anchor:true };
  const open = ALL.filter(m=>unlockedM(m) && !moduleDone(m.id));
  const m = open[0];
  if(!m){
    const locked = ELECTIVES.filter(x=>!unlockedM(x));
    if(locked.length) return { t:"Destravar "+locked[0].title, d:"Requisito: "+requirement(locked[0])+". Refaça laboratórios para somar pontos.", go:"growth", btn:"Ver minhas competências" };
    return { t:"Registrar um caso aplicado", d:"Você concluiu o conteúdo. O próximo ganho vem do uso real.", go:"portfolio", btn:"Abrir portfólio" };
  }
  const p = moduleProgress(m.id);
  const falta = !m.lessons.every(l=>lessonDone(m.id,l.id)) ? "lessons" : !labDone(m.id) ? "lab" : "quiz";
  const nome = falta === "lessons" ? "continuar as aulas" : falta === "lab" ? "fazer o laboratório" : "enfrentar o desafio";
  return { t:m.title, d:"Próximo passo: "+nome+" · "+p.done+"/"+p.total+" etapas", goMod:[m.id, falta], btn:"Continuar →" };
}
function radarSvg(size){
  const r = size/2 - 26, cx = size/2, cy = size/2, n = CAPS.length;
  const pt = (i, f) => {
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    return [cx + Math.cos(ang)*r*f, cy + Math.sin(ang)*r*f];
  };
  const ring = f => CAPS.map((_,i)=>pt(i,f).join(",")).join(" ");
  const vals = CAPS.map(c => Math.max(.04, Math.min(1, capPoints(c.id)/capMax(c.id))));
  const poly = CAPS.map((_,i)=>pt(i,vals[i]).join(",")).join(" ");
  const axes = CAPS.map((_,i)=>{ const [x,y]=pt(i,1); return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'; }).join("");
  const labels = CAPS.map((c,i)=>{
    const [x,y] = pt(i, 1.19);
    return '<text x="'+x+'" y="'+y+'" font-size="10.5" fill="var(--txt-3)" text-anchor="middle" dominant-baseline="middle">'+c.curto+'</text>';
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="${size}" role="img" aria-label="Radar de competências">
    ${[1,.75,.5,.25].map(f=>'<polygon points="'+ring(f)+'" fill="none" stroke="var(--line-soft)" stroke-width="1"/>').join("")}
    ${axes}

function finishLab(m, score, badge){
  const prev = labScore(m.id);

    creditCaps(m.id, "lab", score/100);

function wireQuiz(m){
  document.getElementById("quizSubmit").onclick = () => {
    let score = 0;
    m.quiz.forEach((q,qi)=>{
      const sel = document.querySelector('input[name="q'+qi+'"]:checked');
      document.querySelectorAll('[data-q="'+qi+'"]').forEach(l=>l.classList.remove("correct","wrong"));
      document.querySelector('[data-q="'+qi+'"][data-o="'+q.a+'"]').classList.add("correct");
      if(sel){
        if(+sel.value === q.a) score++;
        else document.querySelector('[data-q="'+qi+'"][data-o="'+sel.value+'"]').classList.add("wrong");
      }
      const why = document.querySelector('[data-why="'+qi+'"]');
      why.style.display = "block"; why.innerHTML = "<b>Por quê:</b> " + q.why;
    });
    m.quiz.forEach((q,qi)=>{
      const sel = document.querySelector('input[name="q'+qi+'"]:checked');
      if(!sel || +sel.value !== q.a) scheduleReview(m.id, qi);
    });
    const alreadyPassed = quizPassed(m.id);
    const prev = quizScore(m.id) ?? 0;
    S.quizzes[m.id] = Math.max(prev, score); save();
    if(score > prev) creditCaps(m.id, "quiz", (score-prev)/3);
    if(score === 3) grant("perfect");
    if(!alreadyPassed && score >= 2) addXp(XP.quiz, "Desafio superado"); else logActivity();
    tabBadge("quiz", quizScore(m.id) + "/3");
    document.getElementById("quizMsg").textContent = score + "/3 — " + (score>=2 ? "aprovado!" : "revise as explicações e tente de novo.");
    if(score >= 2 && moduleDone(m.id)){
      if(m.elective) grant("spec");
      if(MODULES.every(x=>moduleDone(x.id))) grant("grad");
      setTimeout(()=>go("module", m.id, "quiz"), 900);
    }
    renderChrome();
  };
}

const LABS = {}, LAB_WIRE = {};

LAB_WIRE.prompt = m => {
  const rules = [
    { k:"papel",   re:/(como|atue|aja|você é|voce e|no papel|especialista|analista|revisor|consultor|gerente|engenheir)/i },
    { k:"objetivo",re:/(resum|liste|compare|classifiqu|escrev|gere|extrai|extra|transform|priorize|identifiqu|crie|monte|analis)/i },
    { k:"contexto",re:/(abaixo|a seguir|anexo|documento|texto|dados|respostas|ata|público|publico|diretoria|equipe|cliente|período|periodo)/i },
    { k:"formato", re:/(tabela|bullets?|tópicos|topicos|json|markdown|colunas?|no máximo|no maximo|até \d|ate \d|\d+\s*(itens|bullets|linhas|palavras|frases))/i },
    { k:"restric", re:/(não|nao|evite|apenas|somente|se faltar|caso falte|pergunte|marque|sinalize|cite|não invente|sem inventar)/i }
  ];
  const example = `Atue como chefe de gabinete experiente.
Objetivo: transformar a ata abaixo em um resumo de decisão para a diretoria.
Contexto: reunião de 90 min do comitê de operações; o público conhece o projeto, mas não os detalhes técnicos.
Formato: no máximo 6 bullets + uma tabela final com coluna Responsável, Ação, Prazo.
Restrições: use somente informação presente na ata; marque com [?] tudo que estiver ambíguo; não invente prazos. Se faltar o responsável de alguma ação, pergunte antes de concluir.

ATA:
"""
<colar aqui>
"""`;

  const run = () => {
    const txt = document.getElementById("pIn").value.trim();
    const hits = rules.map(r => r.re.test(txt));
    const long = txt.split(/\s+/).filter(Boolean).length >= 25;
    let score = Math.round(hits.filter(Boolean).length / rules.length * 85) + (long ? 15 : 0);
    if(!txt) score = 0;
    document.querySelectorAll("#pChecks .check").forEach((el,i)=>el.classList.toggle("ok", !!hits[i]));
    document.getElementById("pScore").textContent = score + "/100";
    document.getElementById("pLabel").textContent =
      score >= 80 ? "especificação sólida" : score >= 50 ? "no caminho — falta precisão" : score > 0 ? "muito genérico" : "vazio";
    document.getElementById("pOut").textContent =
      score === 0 ? "Envie um prompt para ver como o modelo responderia." :
      score >= 80 ? "▸ Decisão: comitê aprovou seguir com o piloto na unidade B.\n▸ Risco aberto: integração com o ERP sem responsável definido [?]\n▸ Orçamento discutido: R$ 180 mil (valor citado uma vez, sem confirmação) [?]\n▸ Próxima revisão: 12/03\n\n| Responsável | Ação | Prazo |\n|---|---|---|\n| Marina | Fechar escopo do piloto | 05/03 |\n| Time ERP | Levantar esforço de integração | 10/03 |\n\nPergunta antes de fechar: quem assume a integração com o ERP? A ata não define." :

LAB_WIRE.pipeline = m => {

    document.getElementById("plist").innerHTML = window.__pipe.map((si,pos)=>`<div class="step">

      </span></div>`).join("");
    document.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => {
      const p = +b.dataset.mv, d = +b.dataset.dir, a = window.__pipe;
      [a[p], a[p+d]] = [a[p+d], a[p]]; draw();
    });
  };
  draw();
  document.getElementById("sRun").onclick = () => {
    const right = window.__pipe.filter((si,pos)=>si===pos).length;
    const score = Math.round(right/STEPS.length*100);
    document.getElementById("sScore").textContent = score + "/100";
    document.getElementById("sLabel").textContent = right + " de " + STEPS.length + " etapas na posição correta";

    });
  };
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const txt = document.getElementById(b.dataset.copy).textContent;
    navigator.clipboard && navigator.clipboard.writeText(txt);
    toast("Prompt copiado", "Cole no seu assistente");
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    S.prompts.splice(+b.dataset.del, 1); save(); go("library", null, "meus");
  });
}

/* ---------------- evolução ---------------- */
function viewGrowth(){
  document.getElementById("crumb").textContent = "Evolução";
  document.getElementById("title").textContent = "Suas competências";
  const cards = CAPS.map(c=>{
    const p = capPoints(c.id), lv = capLevel(c.id), nx = capNext(c.id);
    const pct = Math.min(100, Math.round(p/capMax(c.id)*100));
    const fontes = ALL.filter(m=>m.caps[c.id] && !moduleDone(m.id) && unlockedM(m)).slice(0,2);
    return `<div class="card">
      <div class="row" style="align-items:baseline"><b style="font-size:15px">${c.nome}</b>
        <span class="pill open" style="margin-left:auto">${lv.t}</span></div>
      <p class="mini" style="margin:6px 0 10px">${c.d}</p>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="row" style="justify-content:space-between"><span class="mini">${p} pts</span>
        <span class="mini">${nx ? "faltam " + (nx.min - p) + " para " + nx.t : "nível máximo"}</span></div>
      ${fontes.length ? '<div class="mini" style="margin-top:10px">Onde ganhar mais: '+fontes.map(f=>'<a href="#" data-goto="module:'+f.id+':lessons">'+f.title+'</a>').join(" · ")+'</div>' : ""}
    </div>`;
  }).join("");
  const locked = ELECTIVES.filter(m=>!unlockedM(m));
  const gate = locked.length ? `<div class="card" style="margin-top:16px">
    <div class="eyebrow">O que sua competência ainda não abriu</div>
    ${locked.map(m=>`<div class="kv"><span>${m.title}</span><b class="mini">${requirement(m)}</b></div>`).join("")}
  </div>` : "";
  return `<div class="grid" style="grid-template-columns:1fr 320px">
      <div>
        <p class="muted">Competência é creditada por prática avaliada: cada aula, laboratório e desafio soma pontos nas capabilities do módulo, proporcionalmente ao seu desempenho.</p>
        <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(290px,1fr))">${cards}</div>
        ${gate}
      </div>
      <div class="card" style="align-self:start">
        <div class="eyebrow">Radar</div>
        ${radarSvg(260)}
        <div class="sep"></div>
        <div class="eyebrow">Conquistas · ${S.badges.length}/${BADGES.length}</div>
        <div class="badges" style="grid-template-columns:1fr 1fr;margin-top:10px">
          ${BADGES.map(b=>`<div class="badge-card ${S.badges.includes(b.id)?"earned":""}" style="padding:10px">
            <div class="em" style="font-size:20px">${b.em}</div><b style="font-size:12px">${b.t}</b><span style="font-size:11px">${b.d}</span></div>`).join("")}
        </div>
      </div>
    </div>`;
}

/* ---------------- portfólio ---------------- */
function viewPortfolio(){
  document.getElementById("crumb").textContent = "Portfólio";
  document.getElementById("title").textContent = "Aplicação no trabalho real";
  const horas = S.cases.reduce((s,c)=>s+(+c.horas||0),0);
  const rows = S.cases.length ? S.cases.map((c,i)=>`<div class="card" style="margin-bottom:10px">
      <div class="row" style="align-items:flex-start">
        <div style="min-width:0">
          <div class="eyebrow">${c.at} · ${c.status}</div>
          <b style="font-size:14.5px">${esc(c.t)}</b>
          <p class="mini" style="margin:6px 0 0">${esc(c.d)}</p>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div class="score" style="font-size:20px">${c.horas}h</div>
          <div class="mini">por semana</div>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn soft sm" data-cstat="${i}">${c.status === "em piloto" ? "Marcar como em produção" : "Voltar para piloto"}</button>
        <button class="btn soft sm" data-cdel="${i}">Remover</button>
      </div>
    </div>`).join("") : `<div class="card"><b>Nenhum caso registrado</b><p class="mini" style="margin:6px 0 0">O portfólio é o que transforma aprendizado em evidência: caso aplicado, ganho estimado e situação atual.</p></div>`;

  return `<div class="grid" style="grid-template-columns:1fr 320px">
    <div>
      <p class="muted">Registre onde a IA entrou no seu trabalho de verdade. Esses casos alimentam o certificado e o argumento de retorno para a liderança.</p>
      ${rows}
    </div>
    <div class="card" style="align-self:start">
      <div class="eyebrow">Novo caso</div>
      <label class="mini" style="display:block;margin-top:8px">Processo</label>
      <input type="text" id="cT" placeholder="Ex.: triagem de chamados">
      <label class="mini" style="display:block;margin-top:10px">Como a IA entra e como você verifica</label>
      <textarea id="cD" rows="3" placeholder="Ex.: classifica por assunto; confiro amostra de 20 por dia"></textarea>
      <label class="mini" style="display:block;margin-top:10px">Horas economizadas por semana</label>
      <input type="number" id="cH" min="0" step="0.5" placeholder="3">
      <button class="btn" style="margin-top:12px" id="cAdd">Registrar caso</button>
      <div class="sep"></div>
      <div class="kv"><span>Casos</span><b>${S.cases.length}</b></div>
      <div class="kv"><span>Ganho declarado</span><b>${horas}h/semana</b></div>
      <div class="kv"><span>Em produção</span><b>${S.cases.filter(c=>c.status!=="em piloto").length}</b></div>
    </div>
  </div>`;
}
function wirePortfolio(){
  document.getElementById("cAdd").onclick = () => {
    const t = document.getElementById("cT").value.trim();
    const d = document.getElementById("cD").value.trim();
    const h = +document.getElementById("cH").value || 0;
    if(t.length < 4 || d.length < 8){ toast("Faltam informações", "Descreva o processo e a verificação"); return; }
    S.cases.push({ t, d, horas: h, status: "em piloto", at: today() });
    save(); logActivity();
    if(h > 0 && !S.badges.includes("applied")) grant("applied");
    toast("Caso registrado", h ? h + "h/semana somadas ao seu impacto" : "Sem ganho declarado ainda");
    go("portfolio");
  };
  document.querySelectorAll("[data-cstat]").forEach(b => b.onclick = () => {
    const c = S.cases[+b.dataset.cstat];
    c.status = c.status === "em piloto" ? "em produção" : "em piloto";
    save(); go("portfolio");
  });
  document.querySelectorAll("[data-cdel]").forEach(b => b.onclick = () => {
    S.cases.splice(+b.dataset.cdel,1); save(); go("portfolio");
  });
}

/* ---------------- perfil ---------------- */
function viewProfile(){
  document.getElementById("crumb").textContent = "Perfil";
  document.getElementById("title").textContent = "Seu progresso";
  const done = MODULES.filter(m=>moduleDone(m.id)).length;
  const all = done === MODULES.length;
  const specs = ELECTIVES.filter(m=>moduleDone(m.id));
  const horas = S.cases.reduce((s,c)=>s+(+c.horas||0),0);
  const rows = ALL.map((m,i)=>{
    const p = moduleProgress(m.id);
    const label = moduleDone(m.id) ? (waived(m.id) ? "dispensado" : "concluído") : unlockedM(m) ? p.pct+"%" : "bloqueado";
    return `<div class="kv"><span>${m.elective ? "◆" : (i+1)+"."} ${m.title}</span><b>${label}</b></div>`;
  }).join("");
  const capRows = CAPS.map(c=>`<div class="kv"><span>${c.nome}</span><b>${capLevel(c.id).t} · ${capPoints(c.id)}</b></div>`).join("");
  const cert = all ? `<div class="cert" style="margin-bottom:18px">
      <div class="eyebrow" style="color:var(--gold)">Certificado de conclusão</div>
      <h2>Fundamentos de IA aplicada ao trabalho</h2>
      <p class="muted">Trilha base concluída com ${S.xp} XP e ${S.badges.length} conquistas.<br>
      Competências: ${CAPS.map(c=>c.curto+" "+capLevel(c.id).t.toLowerCase()).join(" · ")}<br>
      ${specs.length ? "Especializações: <b>"+specs.map(s=>s.title).join(", ")+"</b><br>" : ""}
      Projeto final: <b>${S.capstone || "—"}</b><br>
      Aplicação registrada: <b>${S.cases.length} caso(s), ${horas}h/semana</b></p>
      <button class="btn" onclick="window.print()">Imprimir certificado</button>
    </div>` : `<div class="card" style="margin-bottom:18px">
      <div class="eyebrow">Certificado</div>
      <h3 style="margin:6px 0 6px;font-size:16px">Disponível ao concluir os 6 módulos da trilha base</h3>
      <p class="muted" style="margin:0">Você concluiu ${done} de ${MODULES.length}. O certificado registra nível por competência, especializações, projeto final e casos aplicados — não apenas conclusão.</p>
    </div>`;
  return cert + `<div class="grid" style="grid-template-columns:1fr 300px">
    <div class="card"><div class="eyebrow">Progresso por módulo</div><div style="margin-top:8px">${rows}</div>
      <div class="sep"></div>
      <div class="eyebrow">Nível por competência</div><div style="margin-top:8px">${capRows}</div>
    </div>
    <div class="card" style="align-self:start">
      <div class="eyebrow">Resumo</div>
      <div class="kv" style="margin-top:8px"><span>Nível</span><b>${levelOf(S.xp)}</b></div>
      <div class="kv"><span>XP</span><b>${S.xp}</b></div>
      <div class="kv"><span>Laboratórios</span><b>${ALL.filter(m=>labDone(m.id)).length}/${ALL.length}</b></div>
      <div class="kv"><span>Conquistas</span><b>${S.badges.length}/${BADGES.length}</b></div>
      <div class="kv"><span>Revisões agendadas</span><b>${S.review.length}</b></div>
      <div class="kv"><span>Casos aplicados</span><b>${S.cases.length}</b></div>
      <div class="sep"></div>
      <div class="eyebrow">Continuidade</div>
      <p class="mini" style="margin:8px 0 10px">Neste protótipo o progresso vive só neste navegador. Exporte para levar para outra máquina — na versão real isso vira conta de usuário.</p>
      <div class="row">
        <button class="btn soft sm" id="expBtn">Exportar progresso</button>
        <button class="btn soft sm" id="impBtn">Importar</button>
        <input type="file" id="impFile" accept="application/json" style="display:none">
      </div>
      <div class="sep"></div>
      <button class="btn soft sm" id="redoDiag">Refazer diagnóstico</button>
    </div></div>`;
}
function wireProfile(){
  document.getElementById("expBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "atelie-ia-progresso.json";
    a.click(); URL.revokeObjectURL(a.href);
    toast("Progresso exportado", "atelie-ia-progresso.json");
  };
  const file = document.getElementById("impFile");
  document.getElementById("impBtn").onclick = () => file.click();
  file.onchange = () => {
    const f = file.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        S = Object.assign(blank(), JSON.parse(r.result));
        save(); toast("Progresso importado", "Estado restaurado"); go("home");
      }catch(e){ toast("Arquivo inválido", "Esperado um JSON exportado aqui"); }
    };
    r.readAsText(f);
  };
  document.getElementById("redoDiag").onclick = () => { S.diag = null; save(); go("diag"); };
}

render();
</script>
